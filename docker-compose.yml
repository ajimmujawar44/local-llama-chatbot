services:
  local-llama-chatbot:

    build:
      context: .
      dockerfile: Dockerfile

    container_name: local-llama-chatbot

    ports:
      - "8501:8501"

    environment:
      LLM_BASE_URL: http://host.docker.internal:12434/engines/v1
      LLM_API_KEY: docker
      LLM_MODEL: ai/llama3.2:1B-Q4_0

    restart: unless-stopped